<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日麻记分牌 · 展示</title>
<style>
:root{
  --bg:#0a0e1a; --bg2:#162236; --card:#1a2236; --line:#2a3448;
  --text:#e8edf5; --muted:#8896ab; --accent:#f59e0b; --gold:#fbbf24;
  --green:#22c55e; --red:#ef4444; --riichi:#ef4444;
  --wind-E:#dc2626; --wind-S:#2563eb; --wind-W:#16a34a; --wind-N:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:radial-gradient(circle at top,var(--bg2) 0%,var(--bg) 70%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
.wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto;
  padding:1.5vh 1.5vw;gap:1.2vh}

/* ===== Header ===== */
header{display:flex;justify-content:center;align-items:stretch;gap:1vw;height:9vh}
.chip{display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:1vh 1.6vw;border-radius:1.2vh;min-width:9vw;
  background:linear-gradient(135deg,rgba(26,34,54,.95),rgba(20,28,46,.95));
  border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.chip .label{font-size:1.4vh;color:var(--muted);letter-spacing:.15vw;margin-bottom:.4vh;font-weight:500}
.chip .value{font-size:3.2vh;font-weight:900;color:var(--text);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .value small{font-size:1.8vh;color:var(--accent);font-weight:800;margin-left:.4vw}
.chip.dealer{border-color:rgba(245,158,11,.6);background:linear-gradient(135deg,rgba(58,42,16,.95),rgba(40,28,10,.95));box-shadow:0 2px 12px rgba(245,158,11,.25)}
.chip.dealer .value{color:var(--accent)}
.chip.riichi-chip{border-color:rgba(239,68,68,.5);background:linear-gradient(135deg,rgba(42,10,16,.95),rgba(28,8,12,.95))}
.chip.riichi-chip .value{color:var(--red)}
.chip.total-chip.warn .value{color:var(--red)}

/* ===== 正常比赛网格 ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.1vh 1.1vw;min-height:0}
.player{position:relative;background:linear-gradient(135deg,rgba(26,34,54,.95),rgba(18,24,40,.95));border:2px solid var(--line);border-radius:2vh;padding:2vh 2.2vw;display:flex;flex-direction:column;gap:1.2vh;overflow:hidden;transition:all .3s}
.player.pos-0{grid-column:1;grid-row:1}
.player.pos-1{grid-column:1;grid-row:2}
.player.pos-2{grid-column:2;grid-row:2}
.player.pos-3{grid-column:2;grid-row:1}
.player.dealer{background:linear-gradient(135deg,rgba(58,42,16,.95),rgba(40,28,10,.95));border-color:rgba(245,158,11,.8);box-shadow:0 0 2.5vh rgba(245,158,11,.25),inset 0 0 2vh rgba(245,158,11,.05)}
.player.riichi{background:linear-gradient(135deg,rgba(42,10,16,.95),rgba(30,8,12,.95));border-color:var(--red);box-shadow:0 0 2.5vh rgba(239,68,68,.35),inset 0 0 2vh rgba(239,68,68,.08);animation:riichi-pulse 2.4s ease-in-out infinite}
@keyframes riichi-pulse{
  0%,100%{box-shadow:0 0 2.5vh rgba(239,68,68,.35),inset 0 0 2vh rgba(239,68,68,.08)}
  50%{box-shadow:0 0 4vh rgba(239,68,68,.6),inset 0 0 2.5vh rgba(239,68,68,.12)}
}
.player.riichi::before{content:"";position:absolute;top:0;left:0;right:0;height:.8vh;background:linear-gradient(90deg,transparent,var(--red),transparent);box-shadow:0 0 2vh var(--red)}
.player.dealer.riichi{background:linear-gradient(135deg,rgba(58,26,24,.95),rgba(40,18,16,.95));border-color:rgba(245,158,11,.9);box-shadow:0 0 2.5vh rgba(245,158,11,.4),0 0 4vh rgba(239,68,68,.3);animation:none}

.card-header{display:flex;align-items:center;gap:1vw;position:relative;z-index:1}
.wind-badge{width:6.5vh;height:6.5vh;border-radius:50%;font-size:3.6vh;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid rgba(255,255,255,.2);box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 -2px 6px rgba(0,0,0,.2);text-shadow:0 2px 4px rgba(0,0,0,.3)}
.wind-badge.wind-E{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.wind-badge.wind-S{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff}
.wind-badge.wind-W{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff}
.wind-badge.wind-N{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.name{font-size:3vh;font-weight:800;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.05vw}
.player.dealer .name{color:var(--accent)}
.player.riichi .name{color:#fca5a5}
.badge-tag{font-size:1.7vh;font-weight:900;padding:.5vh 1vw;border-radius:.6vh;letter-spacing:.15vw;flex-shrink:0}
.dealer-badge{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1208;box-shadow:0 2px 6px rgba(245,158,11,.4)}
.riichi-badge{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 2px 6px rgba(239,68,68,.5)}

.card-body{display:flex;align-items:center;justify-content:space-between;gap:1.5vw;flex:1;min-height:0}
.pts{font-size:14vh;font-weight:900;line-height:1;letter-spacing:-.2vw;font-variant-numeric:tabular-nums;text-shadow:0 3px 12px rgba(0,0,0,.5);flex:1;min-width:0;display:flex;align-items:center}
.pts.neg{color:var(--red);font-size:11vh}
.avatar{width:12vh;height:12vh;border-radius:50%;font-size:6vh;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;border:3px solid rgba(255,255,255,.15);box-shadow:0 4px 16px rgba(0,0,0,.5);flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.player.dealer .avatar{border-color:rgba(245,158,11,.85);box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 2vh rgba(245,158,11,.4)}
.player.riichi .avatar{border-color:rgba(239,68,68,.85);box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 2vh rgba(239,68,68,.4)}

.card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:1vh;border-top:1px solid rgba(255,255,255,.08);font-size:2.4vh}
.rank{font-weight:900;color:var(--muted);letter-spacing:.1vw}
.rank.r1{color:var(--gold)}
.rank.r4{color:#5a6478}
.settle{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.settle.pos{color:var(--green)}
.settle.neg{color:var(--red)}

/* ===== 本场结算 ===== */
.match-summary{display:none;flex-direction:column;gap:1.5vh;min-height:0;flex:1}
.match-summary.show{display:flex}
.ms-header{text-align:center;flex-shrink:0}
.ms-title{font-size:4vh;font-weight:900;color:var(--gold);letter-spacing:.25vw;text-shadow:0 0 4vh rgba(251,191,36,.5);margin-bottom:.5vh}
.ms-subtitle{font-size:2vh;color:var(--muted);font-weight:600}
.ms-list{flex:1;display:flex;flex-direction:column;gap:1.1vh;min-height:0}
.ms-row{flex:1;display:flex;align-items:center;gap:2vw;padding:1.5vh 2.5vw;background:linear-gradient(135deg,rgba(26,34,54,.95),rgba(18,24,40,.95));border:2px solid var(--line);border-radius:1.6vh;position:relative;overflow:hidden}
.ms-row.rank1{flex:1.3;border-color:var(--gold);background:linear-gradient(135deg,rgba(58,42,16,.95),rgba(40,28,10,.95));box-shadow:0 0 4vh rgba(251,191,36,.5),inset 0 0 3vh rgba(251,191,36,.08);animation:winner-glow 2.5s ease-in-out infinite}
@keyframes winner-glow{0%,100%{box-shadow:0 0 4vh rgba(251,191,36,.5),inset 0 0 3vh rgba(251,191,36,.08)}50%{box-shadow:0 0 7vh rgba(251,191,36,.8),inset 0 0 3.5vh rgba(251,191,36,.15)}}
.ms-row.rank1::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1vw;background:linear-gradient(180deg,#fbbf24,#f59e0b);box-shadow:0 0 2.5vh var(--gold)}
.ms-rank{width:8vh;height:8vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4.5vh;font-weight:900;flex-shrink:0;background:var(--card);color:var(--muted);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.ms-row.rank1 .ms-rank{width:11vh;height:11vh;font-size:6vh;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1208;border-color:var(--gold);box-shadow:0 0 3vh rgba(251,191,36,.7);animation:rank-bounce 1.6s ease-in-out infinite}
@keyframes rank-bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ms-trophy{font-size:9vh;flex-shrink:0;line-height:1;filter:drop-shadow(0 0 2vh rgba(251,191,36,.8));animation:trophy-float 2.4s ease-in-out infinite}
.ms-row.rank1 .ms-trophy{font-size:12vh}
@keyframes trophy-float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-1.5vh) rotate(5deg)}}
.ms-avatar{width:9vh;height:9vh;border-radius:50%;font-size:4.5vh;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;flex-shrink:0;border:3px solid rgba(255,255,255,.15);box-shadow:0 4px 16px rgba(0,0,0,.5)}
.ms-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ms-row.rank1 .ms-avatar{width:12vh;height:12vh;font-size:6vh;border-color:var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 3vh rgba(251,191,36,.6)}
.ms-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6vh}
.ms-name{font-size:3.2vh;font-weight:800;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-row.rank1 .ms-name{color:var(--gold);font-size:4.2vh;text-shadow:0 0 2vh rgba(251,191,36,.5)}
.ms-pts{font-size:1.8vh;color:var(--muted);font-weight:600}
.ms-row.rank1 .ms-pts{font-size:2.2vh;color:#fcd34d}
.ms-settle{font-size:6.5vh;font-weight:900;line-height:1;letter-spacing:-.15vw;font-variant-numeric:tabular-nums;text-shadow:0 3px 12px rgba(0,0,0,.5);flex-shrink:0;text-align:right}
.ms-settle.pos{color:var(--green)}
.ms-settle.neg{color:var(--red)}
.ms-row.rank1 .ms-settle{font-size:9vh;color:var(--gold);text-shadow:0 0 3vh rgba(251,191,36,.6)}

/* ===== 今日总冠军 ===== */
.day-summary{display:none;flex-direction:column;gap:1.5vh;min-height:0;flex:1;position:relative;overflow:hidden}
.day-summary.show{display:flex}
.day-summary::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(251,191,36,.18) 0%,transparent 60%);pointer-events:none}
.confetti{position:absolute;top:-10vh;font-size:3vh;animation:confetti-fall linear infinite;pointer-events:none;z-index:0}
@keyframes confetti-fall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.ds-header{text-align:center;flex-shrink:0;position:relative;z-index:2}
.ds-crown{font-size:8vh;line-height:1;margin-bottom:.5vh;filter:drop-shadow(0 0 3vh rgba(251,191,36,.9));animation:crown-float 3s ease-in-out infinite}
@keyframes crown-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5vh) scale(1.05)}}
.ds-title{font-size:5vh;font-weight:900;color:var(--gold);letter-spacing:.5vw;text-shadow:0 0 4vh rgba(251,191,36,.7),0 4px 8px rgba(0,0,0,.5);margin-bottom:.5vh;background:linear-gradient(135deg,#fbbf24,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ds-subtitle{font-size:1.8vh;color:var(--muted);font-weight:600}
.champion-area{flex:1.3;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;min-height:0}
.champion-card{display:flex;align-items:center;gap:2.5vw;padding:2.5vh 3.5vw;background:linear-gradient(135deg,rgba(58,42,16,.98),rgba(40,28,10,.98));border:3px solid var(--gold);border-radius:2.5vh;box-shadow:0 0 6vh rgba(251,191,36,.6),inset 0 0 3vh rgba(251,191,36,.15);position:relative;max-width:90%;animation:champion-glow 2.5s ease-in-out infinite}
@keyframes champion-glow{0%,100%{box-shadow:0 0 6vh rgba(251,191,36,.6),inset 0 0 3vh rgba(251,191,36,.15)}50%{box-shadow:0 0 10vh rgba(251,191,36,.9),inset 0 0 4vh rgba(251,191,36,.25)}}
.champion-card::before,.champion-card::after{content:"🌸";position:absolute;font-size:4vh;filter:drop-shadow(0 0 1vh rgba(251,191,36,.6));animation:petal-swing 3s ease-in-out infinite}
.champion-card::before{top:-2vh;left:2vw;animation-delay:0s}
.champion-card::after{top:-2vh;right:2vw;animation-delay:1.5s}
@keyframes petal-swing{0%,100%{transform:rotate(-15deg) translateY(0)}50%{transform:rotate(15deg) translateY(-1vh)}}
.champion-avatar{width:20vh;height:20vh;border-radius:50%;font-size:10vh;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;flex-shrink:0;border:5px solid var(--gold);box-shadow:0 0 4vh rgba(251,191,36,.8),inset 0 0 3vh rgba(251,191,36,.3)}
.champion-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.champion-info{display:flex;flex-direction:column;gap:1vh;min-width:0}
.champion-title{font-size:2vh;color:#fcd34d;font-weight:800;letter-spacing:.3vw}
.champion-name{font-size:5.5vh;font-weight:900;color:var(--gold);text-shadow:0 0 3vh rgba(251,191,36,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.champion-score{font-size:11vh;font-weight:900;line-height:1;letter-spacing:-.2vw;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 0 4vh rgba(251,191,36,.6),0 4px 12px rgba(0,0,0,.6)}
.champion-stats{font-size:2vh;color:#fcd34d;font-weight:600;display:flex;gap:2vw;flex-wrap:wrap}
.champion-stats b{color:var(--gold);font-size:2.4vh}
.runners-area{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.5vw;min-height:0;position:relative;z-index:2}
.runner-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vh;padding:1.5vh 1vw;background:linear-gradient(135deg,rgba(26,34,54,.95),rgba(18,24,40,.95));border:2px solid var(--line);border-radius:1.6vh;position:relative}
.runner-card.rank2{border-color:#c0c0c0;box-shadow:0 0 2vh rgba(192,192,192,.3)}
.runner-card.rank3{border-color:#cd7f32;box-shadow:0 0 2vh rgba(205,127,50,.3)}
.runner-card.rank4{border-color:#6b7280}
.runner-rank{position:absolute;top:1vh;right:1vw;font-size:2vh;font-weight:900;padding:.4vh 1vw;border-radius:.6vh;background:var(--line);color:var(--text)}
.runner-card.rank2 .runner-rank{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#1a1208}
.runner-card.rank3 .runner-rank{background:linear-gradient(135deg,#d97706,#92400e);color:#fff}
.runner-card.rank4 .runner-rank{background:#4b5563;color:#e5e7eb}
.runner-avatar{width:9vh;height:9vh;border-radius:50%;font-size:4.5vh;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.2);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.runner-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.runner-card.rank2 .runner-avatar{border-color:#e5e7eb;box-shadow:0 0 2vh rgba(192,192,192,.5)}
.runner-card.rank3 .runner-avatar{border-color:#d97706;box-shadow:0 0 2vh rgba(205,127,50,.5)}
.runner-name{font-size:2.6vh;font-weight:800;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.runner-score{font-size:4.5vh;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.runner-score.pos{color:var(--green)}
.runner-score.neg{color:var(--red)}
.runner-stats{font-size:1.5vh;color:var(--muted);text-align:center}
.runner-stats b{color:var(--text)}

/* ===== 点炮动画 ===== */
.cannon-shell{
  position:fixed;font-size:6vh;z-index:9999;pointer-events:none;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 2vh rgba(239,68,68,.9));
  animation:cannon-fly 0.6s cubic-bezier(0.5, 0, 1, 1) forwards;
}
@keyframes cannon-fly{
  0%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}
  100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.5) rotate(720deg)}
}
.explosion-big{
  position:fixed;font-size:22vh;z-index:9999;pointer-events:none;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 5vh rgba(239,68,68,1));
  animation:explode-big 0.9s ease-out forwards;
}
@keyframes explode-big{
  0%{transform:translate(-50%,-50%) scale(0.2);opacity:1}
  40%{transform:translate(-50%,-50%) scale(1.6);opacity:1}
  100%{transform:translate(-50%,-50%) scale(3);opacity:0}
}
.explosion-particle{
  position:fixed;font-size:4vh;z-index:9999;pointer-events:none;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 1.5vh rgba(239,68,68,.8));
  animation:explode-particle 1s ease-out forwards;
}
@keyframes explode-particle{
  0%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(calc(-50% + var(--px)), calc(-50% + var(--py))) scale(0);opacity:0}
}
.explosion-ring{
  position:fixed;width:10vh;height:10vh;border:3px solid #ef4444;border-radius:50%;
  z-index:9999;pointer-events:none;
  transform:translate(-50%,-50%);
  animation:explode-ring 0.8s ease-out forwards;
}
@keyframes explode-ring{
  0%{transform:translate(-50%,-50%) scale(0.2);opacity:1;border-width:6px}
  100%{transform:translate(-50%,-50%) scale(4);opacity:0;border-width:1px}
}
.card-shake{animation:card-shake 0.7s ease-in-out !important;}
@keyframes card-shake{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  10%{transform:translate(-1vh,0) rotate(-2deg)}
  20%{transform:translate(1vh,0) rotate(2deg)}
  30%{transform:translate(-1vh,0) rotate(-2deg)}
  40%{transform:translate(1vh,0) rotate(2deg)}
  50%{transform:translate(-1vh,0) rotate(-2deg)}
  60%{transform:translate(1vh,0) rotate(2deg)}
  70%{transform:translate(-1vh,0) rotate(-2deg)}
  80%{transform:translate(1vh,0) rotate(2deg)}
  90%{transform:translate(-1vh,0) rotate(-2deg)}
}

/* ===== 自摸金币动画 ===== */
.coin-fly{
  position:fixed;font-size:6vh;z-index:9999;pointer-events:none;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 1.8vh rgba(251,191,36,.95));
  animation:coin-fly 0.7s cubic-bezier(0.5, 0, 0.75, 0) forwards;
}
@keyframes coin-fly{
  0%{transform:translate(-50%,-50%) scale(0.4);opacity:0}
  15%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3);opacity:0.9}
}
.coin-float{
  position:fixed;font-size:6vh;font-weight:900;
  color:#fbbf24;z-index:9999;pointer-events:none;
  text-shadow:0 0 2vh rgba(251,191,36,.8),0 2px 8px rgba(0,0,0,.6);
  transform:translate(-50%,-50%);
  animation:coin-float-up 1s ease-out forwards;
}
@keyframes coin-float-up{
  0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}
  30%{transform:translate(-50%,-120%) scale(1.4);opacity:1}
  100%{transform:translate(-50%,-250%) scale(1);opacity:0}
}

.status{text-align:center;font-size:1.4vh;color:var(--muted);height:2vh}
.status.ok{color:#4ade80}
.status.err{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <header id="mainHeader">
    <div class="chip">
      <div class="label">当前局</div>
      <div class="value" id="roundName">东1局</div>
    </div>
    <div class="chip riichi-chip">
      <div class="label">立直棒</div>
      <div class="value" id="onTable">0</div>
    </div>
    <div class="chip dealer">
      <div class="label">庄家</div>
      <div class="value" id="dealerName">-</div>
    </div>
    <div class="chip">
      <div class="label">连庄</div>
      <div class="value"><span id="renchan">0</span><small id="renchanBonus"></small></div>
    </div>
    <div class="chip total-chip" id="totalChip">
      <div class="label">总计</div>
      <div class="value" id="total">400</div>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="match-summary" id="matchSummary">
    <div class="ms-header">
      <div class="ms-title">🏁 本场结算</div>
      <div class="ms-subtitle" id="msSubtitle"></div>
    </div>
    <div class="ms-list" id="msList"></div>
  </div>

  <div class="day-summary" id="daySummary">
    <div class="ds-header">
      <div class="ds-crown">👑</div>
      <div class="ds-title">今日总冠军</div>
      <div class="ds-subtitle" id="dsDate"></div>
    </div>
    <div class="champion-area" id="championArea"></div>
    <div class="runners-area" id="runnersArea"></div>
  </div>

  <div class="status" id="status">等待手机端数据…</div>
</div>

<script>
(function(){
  "use strict";
  var params = new URLSearchParams(location.search);
  var ROOM = params.get("room");
  var statusEl = document.getElementById("status");
  var RIICHI_VALUE = 4;
  var AVATAR_COLORS = ["#4f46e5", "#0891b2", "#16a34a", "#db2777"];
  var WINDS_CN = ["东", "南", "西", "北"];
  var WINDS_EN = ["E", "S", "W", "N"];
  var CONFETTI_EMOJIS = ["🎉", "🎊", "⭐", "✨", "🌟", "💫", "🏆"];

  var lastPlayedAnimId = null;
  var lastPlayedTsumoAnimId = null;

  if (!ROOM){
    statusEl.textContent = "缺少 room 参数，请用 display.html?room=房间号 打开";
    statusEl.className = "status err";
    return;
  }

  var NTFY = "https://ntfy.sh/" + encodeURIComponent(ROOM);

  function roundName(n){
    if (n <= 0) return "东1局";
    if (n <= 16){
      var winds = ["东","南","西","北"];
      return winds[Math.floor((n - 1) / 4)] + (((n - 1) % 4) + 1) + "局";
    }
    return "延长" + (n - 16) + "局";
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function avatarInner(p){
    var a = (p.avatar || "").trim();
    if (/^https?:\/\//i.test(a)){
      return '<img src="' + escapeHtml(a) + '" alt="" onerror="this.style.display=\'none\'">';
    }
    if (a) return escapeHtml(a);
    var ch = (p.name || "?").trim().charAt(0) || "?";
    return escapeHtml(ch);
  }

  function formatDate(iso){
    try {
      var d = new Date(iso);
      return (d.getMonth()+1) + "月" + d.getDate() + "日 " +
        String(d.getHours()).padStart(2,"0") + ":" +
        String(d.getMinutes()).padStart(2,"0");
    } catch(e){ return ""; }
  }

  function isValidWinds(w){
    if (!Array.isArray(w) || w.length !== 4) return false;
    var s = {};
    for (var i = 0; i < 4; i++){
      if (w[i] < 0 || w[i] > 3 || s[w[i]]) return false;
      s[w[i]] = true;
    }
    return true;
  }

  function showNormal(d){
    document.getElementById("mainHeader").style.display = "";
    document.getElementById("grid").style.display = "";
    document.getElementById("matchSummary").classList.remove("show");
    document.getElementById("daySummary").classList.remove("show");
    renderNormal(d);
  }

  function renderNormal(d){
    var ps = d.settings.players;
    var current = d.current || { riichi: [false,false,false,false] };
    var displayRound = (typeof d.displayRound === "number" && d.displayRound > 0)
      ? d.displayRound
      : (typeof d.currentRound === "number" && d.currentRound > 0 ? d.currentRound : 1);
    if (displayRound < 1) displayRound = 1;
    var winds = isValidWinds(d.winds) ? d.winds : [0,1,2,3];

    document.getElementById("roundName").textContent = roundName(displayRound);
    document.getElementById("renchan").textContent = d.renchan;
    document.getElementById("renchanBonus").textContent =
      d.renchan > 0 ? " · +" + (d.renchan * 3) : "";
    document.getElementById("onTable").textContent = d.onTable;
    document.getElementById("dealerName").textContent =
      d.dealerIdx >= 0 ? ps[d.dealerIdx].name : "-";

    var totalCheck = d.pts.reduce(function(a,b){ return a+b; }, 0) + d.onTable * RIICHI_VALUE;
    var totalEl = document.getElementById("total");
    var totalChip = document.getElementById("totalChip");
    totalEl.textContent = totalCheck;
    if (totalCheck === d.settings.startPoints * 4){
      totalChip.classList.remove("warn");
    } else {
      totalChip.classList.add("warn");
    }

    var rotation = (displayRound - 1) % 4;
    if (rotation < 0) rotation = 0;

    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    ps.forEach(function(p, i){
      var pos = (winds[i] + rotation) % 4;
      if (pos < 0) pos = 0;
      var card = document.createElement("div");
      var cls = "player pos-" + pos;
      if (i === d.dealerIdx) cls += " dealer";
      if (current.riichi[i]) cls += " riichi";
      card.className = cls;
      card.setAttribute("data-idx", i);

      var rankClass = d.ranks[i] === 1 ? "r1" : (d.ranks[i] === 4 ? "r4" : "");
      var settleClass = d.settle[i] > 0 ? "pos" : (d.settle[i] < 0 ? "neg" : "");
      var settleStr = (d.settle[i] > 0 ? "+" : "") + d.settle[i];
      var ptsClass = d.pts[i] < 0 ? "pts neg" : "pts";
      var avBg = AVATAR_COLORS[i % AVATAR_COLORS.length];

      var badges = "";
      if (i === d.dealerIdx) badges += '<div class="badge-tag dealer-badge">庄</div>';
      if (current.riichi[i]) badges += '<div class="badge-tag riichi-badge">立直</div>';

      card.innerHTML =
        '<div class="card-header">' +
          '<div class="wind-badge wind-' + WINDS_EN[winds[i]] + '">' + WINDS_CN[winds[i]] + '</div>' +
          '<div class="name">' + escapeHtml(p.name) + '</div>' +
          badges +
        '</div>' +
        '<div class="card-body">' +
          '<div class="' + ptsClass + '">' + d.pts[i] + '</div>' +
          '<div class="avatar" style="background:' + avBg + '">' + avatarInner(p) + '</div>' +
        '</div>' +
        '<div class="card-footer">' +
          '<span class="rank ' + rankClass + '">' + d.ranks[i] + '位</span>' +
          '<span class="settle ' + settleClass + '">' + settleStr + '</span>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  /* ===== 点炮动画 ===== */
  function playCannonAnimation(winnerIdx, loserIdx){
    var winnerCard = document.querySelector('.player[data-idx="' + winnerIdx + '"]');
    var loserCard = document.querySelector('.player[data-idx="' + loserIdx + '"]');
    if (!winnerCard || !loserCard) return;

    var wRect = winnerCard.getBoundingClientRect();
    var lRect = loserCard.getBoundingClientRect();

    var startX = wRect.left + wRect.width / 2;
    var startY = wRect.top + wRect.height / 2;
    var endX = lRect.left + lRect.width / 2;
    var endY = lRect.top + lRect.height / 2;

    var dx = endX - startX;
    var dy = endY - startY;

    winnerCard.style.transition = "transform 0.15s ease-out";
    winnerCard.style.transform = "scale(0.95)";
    setTimeout(function(){ winnerCard.style.transform = ""; }, 150);

    var shell = document.createElement('div');
    shell.className = 'cannon-shell';
    shell.textContent = '💣';
    shell.style.left = startX + 'px';
    shell.style.top = startY + 'px';
    shell.style.setProperty('--dx', dx + 'px');
    shell.style.setProperty('--dy', dy + 'px');
    document.body.appendChild(shell);

    shell.addEventListener('animationend', function(){
      if (shell.parentNode) shell.remove();
      explodeAt(endX, endY);
      loserCard.classList.add('card-shake');
      setTimeout(function(){ loserCard.classList.remove('card-shake'); }, 750);
    }, { once: true });
  }

  function explodeAt(x, y){
    var big = document.createElement('div');
    big.className = 'explosion-big';
    big.textContent = '💥';
    big.style.left = x + 'px';
    big.style.top = y + 'px';
    document.body.appendChild(big);
    big.addEventListener('animationend', function(){ if (big.parentNode) big.remove(); }, { once: true });

    var ring = document.createElement('div');
    ring.className = 'explosion-ring';
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    document.body.appendChild(ring);
    ring.addEventListener('animationend', function(){ if (ring.parentNode) ring.remove(); }, { once: true });

    var particles = ['🔥','💥','⚡','✨','💢'];
    for (var i = 0; i < 12; i++){
      (function(i){
        var p = document.createElement('div');
        p.className = 'explosion-particle';
        p.textContent = particles[i % particles.length];
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        var angle = (Math.PI * 2 / 12) * i + Math.random() * 0.3;
        var dist = 60 + Math.random() * 100;
        p.style.setProperty('--px', (Math.cos(angle) * dist) + 'px');
        p.style.setProperty('--py', (Math.sin(angle) * dist) + 'px');
        document.body.appendChild(p);
        p.addEventListener('animationend', function(){ if (p.parentNode) p.remove(); }, { once: true });
      })(i);
    }
  }

  /* ===== 自摸金币汇聚动画 ===== */
  function playTsumoAnimation(winnerIdx, payerIdxs, winnerChange){
    var winnerCard = document.querySelector('.player[data-idx="' + winnerIdx + '"]');
    if (!winnerCard) return;
    var wRect = winnerCard.getBoundingClientRect();
    var endX = wRect.left + wRect.width / 2;
    var endY = wRect.top + wRect.height / 2;

    var validPayers = [];
    payerIdxs.forEach(function(pIdx){
      var pc = document.querySelector('.player[data-idx="' + pIdx + '"]');
      if (pc) validPayers.push({ card: pc, idx: pIdx });
    });

    var totalDelay = validPayers.length * 150;

    validPayers.forEach(function(item, i){
      var pRect = item.card.getBoundingClientRect();
      var startX = pRect.left + pRect.width / 2;
      var startY = pRect.top + pRect.height / 2;
      var dx = endX - startX;
      var dy = endY - startY;

      setTimeout(function(){
        item.card.style.transition = "transform 0.15s ease-out";
        item.card.style.transform = "scale(0.96)";
        setTimeout(function(){ item.card.style.transform = ""; }, 150);
      }, i * 150);

      setTimeout(function(){
        var coin = document.createElement('div');
        coin.className = 'coin-fly';
        coin.textContent = '🪙';
        coin.style.left = startX + 'px';
        coin.style.top = startY + 'px';
        coin.style.setProperty('--dx', dx + 'px');
        coin.style.setProperty('--dy', dy + 'px');
        document.body.appendChild(coin);
        coin.addEventListener('animationend', function(){
          if (coin.parentNode) coin.remove();
        }, { once: true });
      }, i * 150 + 100);
    });

    setTimeout(function(){
      winnerCard.style.transition = "transform 0.25s ease-out, box-shadow 0.3s ease-out";
      winnerCard.style.transform = "scale(1.08)";
      winnerCard.style.boxShadow = "0 0 6vh rgba(251,191,36,1), inset 0 0 4vh rgba(251,191,36,.5)";

      setTimeout(function(){
        winnerCard.style.transform = "";
        winnerCard.style.boxShadow = "";
      }, 700);

      if (typeof winnerChange === "number" && winnerChange > 0){
        var float = document.createElement('div');
        float.className = 'coin-float';
        float.textContent = '+' + winnerChange;
        float.style.left = endX + 'px';
        float.style.top = endY + 'px';
        document.body.appendChild(float);
        float.addEventListener('animationend', function(){
          if (float.parentNode) float.remove();
        }, { once: true });
      }
    }, totalDelay + 600);
  }

  /* ===== 本场结算 ===== */
  function showMatchSummary(d){
    document.getElementById("mainHeader").style.display = "none";
    document.getElementById("grid").style.display = "none";
    document.getElementById("daySummary").classList.remove("show");
    document.getElementById("matchSummary").classList.add("show");

    var displayRound = (typeof d.displayRound === "number" && d.displayRound > 0) ? d.displayRound : d.currentRound;
    var subtitleParts = [roundName(displayRound) + " 结束"];
    if (d.endReason) subtitleParts.push(d.endReason);
    document.getElementById("msSubtitle").textContent = subtitleParts.join(" · ");

    var ps = d.settings.players;
    var list = ps.map(function(p, i){
      return {
        name: p.name, avatar: p.avatar || "",
        pts: d.pts[i], settle: d.settle[i], rank: d.ranks[i]
      };
    }).sort(function(a, b){ return a.rank - b.rank; });

    var container = document.getElementById("msList");
    container.innerHTML = "";

    list.forEach(function(m, idx){
      var row = document.createElement("div");
      row.className = "ms-row" + (m.rank === 1 ? " rank1" : "");
      var settleCls = m.settle > 0 ? "pos" : (m.settle < 0 ? "neg" : "");
      var sign = m.settle > 0 ? "+" : "";
      var avBg = AVATAR_COLORS[idx % AVATAR_COLORS.length];
      var trophy = m.rank === 1 ? '<div class="ms-trophy">🏆</div>' : '';

      row.innerHTML =
        '<div class="ms-rank">' + m.rank + '</div>' +
        trophy +
        '<div class="ms-avatar" style="background:' + avBg + '">' + avatarInner(m) + '</div>' +
        '<div class="ms-info">' +
          '<div class="ms-name">' + escapeHtml(m.name) + (m.rank === 1 ? ' 🎉' : '') + '</div>' +
          '<div class="ms-pts">' + m.pts + ' 点</div>' +
        '</div>' +
        '<div class="ms-settle ' + settleCls + '">' + sign + m.settle + '</div>';
      container.appendChild(row);
    });
  }

  /* ===== 今日总冠军 ===== */
  function createConfetti(){
    var container = document.getElementById("daySummary");
    container.querySelectorAll(".confetti").forEach(function(el){ el.remove(); });
    for (var i = 0; i < 18; i++){
      var el = document.createElement("div");
      el.className = "confetti";
      el.textContent = CONFETTI_EMOJIS[Math.floor(Math.random() * CONFETTI_EMOJIS.length)];
      el.style.left = (Math.random() * 100) + "%";
      el.style.animationDuration = (4 + Math.random() * 4) + "s";
      el.style.animationDelay = (Math.random() * 5) + "s";
      el.style.fontSize = (2 + Math.random() * 3) + "vh";
      container.appendChild(el);
    }
  }

  function showDaySummary(d){
    document.getElementById("mainHeader").style.display = "none";
    document.getElementById("grid").style.display = "none";
    document.getElementById("matchSummary").classList.remove("show");
    document.getElementById("daySummary").classList.add("show");

    document.getElementById("dsDate").textContent = d.dayEndedAt ? formatDate(d.dayEndedAt) : "";

    var sorted = (d.daySummary || []).slice().sort(function(a, b){ return a.rank - b.rank; });
    if (sorted.length === 0) return;

    var champion = sorted[0];
    var runners = sorted.slice(1);

    var championArea = document.getElementById("championArea");
    var champRanks = champion.ranks || [0,0,0,0];
    var champFirstRate = champion.matches > 0 ? Math.round(champRanks[0] / champion.matches * 100) : 0;
    var champSign = champion.totalSettle > 0 ? "+" : "";
    var champBg = AVATAR_COLORS[0];

    championArea.innerHTML =
      '<div class="champion-card">' +
        '<div class="champion-avatar" style="background:' + champBg + '">' + avatarInner(champion) + '</div>' +
        '<div class="champion-info">' +
          '<div class="champion-title">👑 总冠军 · 第 1 位</div>' +
          '<div class="champion-name">' + escapeHtml(champion.name) + '</div>' +
          '<div class="champion-score">' + champSign + champion.totalSettle + '</div>' +
          '<div class="champion-stats">' +
            '<span><b>' + champion.matches + '</b> 场</span>' +
            '<span>一位率 <b>' + champFirstRate + '%</b></span>' +
            '<span>顺位 <b>' + champRanks[0] + '/' + champRanks[1] + '/' + champRanks[2] + '/' + champRanks[3] + '</b></span>' +
          '</div>' +
        '</div>' +
      '</div>';

    var runnersArea = document.getElementById("runnersArea");
    runnersArea.innerHTML = "";
    runners.forEach(function(r, idx){
      var card = document.createElement("div");
      card.className = "runner-card rank" + r.rank;
      var rk = r.ranks || [0,0,0,0];
      var settleCls = r.totalSettle > 0 ? "pos" : (r.totalSettle < 0 ? "neg" : "");
      var sign = r.totalSettle > 0 ? "+" : "";
      var avBg = AVATAR_COLORS[(idx + 1) % AVATAR_COLORS.length];
      var medal = r.rank === 2 ? "🥈" : (r.rank === 3 ? "🥉" : "");

      card.innerHTML =
        '<div class="runner-rank">' + r.rank + ' 位</div>' +
        '<div class="runner-avatar" style="background:' + avBg + '">' + avatarInner(r) + '</div>' +
        '<div class="runner-name">' + medal + ' ' + escapeHtml(r.name) + '</div>' +
        '<div class="runner-score ' + settleCls + '">' + sign + r.totalSettle + '</div>' +
        '<div class="runner-stats"><b>' + r.matches + '</b> 场 · 一位率 <b>' +
          (r.matches > 0 ? Math.round(rk[0] / r.matches * 100) : 0) + '%</b></div>';
      runnersArea.appendChild(card);
    });

    createConfetti();
  }

  /* ===== 总渲染 ===== */
  function render(d){
    if (d.dayEnded && d.daySummary && d.daySummary.length > 0){
      showDaySummary(d);
      return;
    }
    if (d.gameEnded){
      showMatchSummary(d);
      return;
    }

    showNormal(d);

    // 点炮动画
    var anim = d.lastWinAnim;
    if (anim && typeof anim.id === "string"
        && typeof anim.winnerIdx === "number"
        && typeof anim.loserIdx === "number"
        && typeof anim.ts === "number"
        && anim.id !== lastPlayedAnimId){
      lastPlayedAnimId = anim.id;
      if (Date.now() - anim.ts < 10000){
        setTimeout(function(){
          playCannonAnimation(anim.winnerIdx, anim.loserIdx);
        }, 120);
      }
    }

    // 自摸动画
    var tanim = d.lastTsumoAnim;
    if (tanim && typeof tanim.id === "string"
        && typeof tanim.winnerIdx === "number"
        && Array.isArray(tanim.payerIdxs)
        && typeof tanim.ts === "number"
        && tanim.id !== lastPlayedTsumoAnimId){
      lastPlayedTsumoAnimId = tanim.id;
      if (Date.now() - tanim.ts < 10000){
        setTimeout(function(){
          playTsumoAnimation(tanim.winnerIdx, tanim.payerIdxs, tanim.winnerChange);
        }, 120);
      }
    }
  }

  var es = new EventSource(NTFY + "/sse");
  es.onopen = function(){
    statusEl.textContent = "已连接，等待手机端数据…";
    statusEl.className = "status";
  };
  es.onerror = function(){
    statusEl.textContent = "连接中断，自动重连中…";
    statusEl.className = "status err";
  };
  es.onmessage = function(e){
    try {
      var msg = JSON.parse(e.data);
      if (msg.event !== "message" || !msg.message) return;
      var data = JSON.parse(msg.message);
      if (!data.settings || !data.pts || !data.current) return;
      render(data);
      statusEl.textContent = "● 已同步";
      statusEl.className = "status ok";
    } catch(err){}
  };
})();
</script>
</body>
</html>
